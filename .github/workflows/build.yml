name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # 失敗したときはコンパイルエラーを注釈として表示（ログを開かなくても原因が見える）
      - name: Report errors
        if: failure()
        run: |
          grep -E '^e: |error:|FAILURE|What went wrong' -A3 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk kaimono-jouzu-v${{ github.run_number }}.apk

      - name: Release notes
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "${MSG:-更新}"
            echo
            echo "---"
            echo "スマホでこのページを開き、下の .apk をタップしてインストールしてください（上書きでOK・データは残ります）。"
          } > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 買い物上手 v${{ github.run_number }}
          body_path: notes.md
          files: kaimono-jouzu-v${{ github.run_number }}.apk
          make_latest: true
